# IOMS -- nginx site, rendered by provision.sh:
#   __SERVER_NAMES__  e.g. "iomsuite.com www.iomsuite.com staging.iomsuite.com"
#   __ROOT__          /srv/ioms/app/public
#
# ARCHITECTURE: visitor --HTTPS--> Cloudflare (proxy, WAF) --HTTPS--> this origin.
# The origin presents a Cloudflare Origin CA certificate (/etc/ssl/ioms/origin.*),
# which Cloudflare validates under SSL mode "Full (strict)". The real visitor IP
# is restored from CF-Connecting-IP by /etc/nginx/conf.d/cloudflare-realip.conf.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;
    # Plain HTTP only ever redirects. Cloudflare "Always Use HTTPS" normally
    # catches this first; this covers a direct hit on the origin.
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx
    # 1.24, which predates that directive (found by the container rehearsal).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAMES__;
    root __ROOT__;
    index index.php;

    ssl_certificate     /etc/ssl/ioms/origin.pem;
    ssl_certificate_key /etc/ssl/ioms/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ioms_ssl:10m;

    charset utf-8;
    client_max_body_size 30M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Built assets are content-hashed by Vite: cache them hard.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The payment provider's callback must reach PHP untouched: no auth,
    # no rate limit here (Laravel verifies the signature), no redirect.
    location = /webhooks/payment/duitku {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/ioms-fpm.sock;   # the ioms pool, running as the app user
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles (.env, .git) or anything outside public/.
    location ~ /\.(?!well-known).* { deny all; }
}

# A request for any OTHER name -- including the bare IP -- gets nothing.
# Scanners that hit 43.173.21.31 directly never see the application.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/ioms/origin.pem;
    ssl_certificate_key /etc/ssl/ioms/origin.key;
    return 444;
}
