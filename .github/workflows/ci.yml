# IOMS continuous integration.
#
# The first step of the release loop (docs/ADR/075): a commit is a release
# CANDIDATE only once this workflow has passed on it. The Tencent release
# watcher (deploy/tencent/hermes/ioms-release-watch) asks GitHub for this
# workflow's conclusion on the exact SHA before it deploys anything, and it
# runs the suite again on the server against that same SHA -- CI is the
# first gate, never the only one.
#
# No secret is used or needed: the suite runs on in-memory SQLite with the
# throwaway APP_KEY that phpunit.xml already pins.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_sqlite, sqlite3, bcmath, exif
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # --- static checks (ADR 076). Each fails the run; none needs a secret.
      - name: ESLint (undefined identifiers, unreachable code, hooks order)
        run: npm run lint

      # Pint on the PHP files THIS push or pull request changes. The repository
      # predates Pint and a whole-tree gate would block every release on old
      # style debt; new and edited code is held to it.
      - name: Pint (changed PHP files)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE:-$BEFORE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch -q --depth=50 origin "${GITHUB_BASE_REF:-main}" || true
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}" 2>/dev/null || git rev-parse HEAD~1)"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$base" HEAD -- '*.php' | grep -v '^database/migrations/' || true)
          if [[ ${#files[@]} -eq 0 ]]; then echo "no changed PHP files"; exit 0; fi
          printf '  %s\n' "${files[@]}"
          vendor/bin/pint --test "${files[@]}"

      - name: Deploy scripts parse
        run: |
          set -euo pipefail
          for f in deploy.sh deploy/tencent/*.sh deploy/tencent/hermes/*.sh deploy/tencent/hermes/ioms-ops \
                   deploy/tencent/hermes/ioms-ci-deploy deploy/tencent/hermes/ioms-release-watch; do
            bash -n "$f" && echo "ok  $f"
          done
          php -l deploy/tencent/hermes/migration-policy.php

      - name: Workflows (actionlint)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          # Runs ShellCheck too (preinstalled on the runner), warnings and errors fail the run.
          SHELLCHECK_OPTS=--severity=warning /tmp/actionlint .github/workflows/*.yml

      # Regression for the Deploy workflow's jq quoting bug (a jq program built in a
      # double-quoted shell string lost its "" and failed `Record the result`).
      - name: Workflow helper scripts (jq, quoting)
        run: |
          set -euo pipefail
          shellcheck -S warning .github/scripts/*.sh
          bash .github/scripts/test-workflows.sh

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # Build into a scratch directory so the committed public/build (what
      # cPanel serves, since it runs no Node) is never overwritten here; the
      # point is to prove the frontend compiles.
      - name: Frontend build compiles
        run: npx vite build --outDir "$RUNNER_TEMP/build-check" --emptyOutDir

      - name: Test suite
        run: php artisan test
