# IOMS -- nginx site. Rendered by provision.sh (__DOMAIN__, __ROOT__).
# TLS is added by certbot --nginx, which rewrites this file in place.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __ROOT__;
    index index.php;

    charset utf-8;
    client_max_body_size 30M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Built assets are content-hashed by Vite: cache them hard.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The payment provider's callback must reach PHP untouched: no auth,
    # no rate limit here (Laravel verifies the signature), no redirect.
    location = /webhooks/payment/duitku {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles (.env, .git) or anything outside public/.
    location ~ /\.(?!well-known).* { deny all; }
}
