; IOMS -- queue worker. QUEUE_CONNECTION=database (see .env.example).
; cPanel could not run this (no long-running process); Lighthouse can, so
; deferred work no longer waits for a web request to drain it.
[program:ioms-worker]
command=/usr/bin/php /srv/ioms/app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/srv/ioms/app
user=ioms
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/srv/ioms/app/storage/logs/worker.log
