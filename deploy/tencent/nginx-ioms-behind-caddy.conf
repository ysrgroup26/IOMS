# IOMS -- nginx site for CADDY MODE, rendered by provision.sh:
#   __SERVER_NAMES__  e.g. "iomsuite.com www.iomsuite.com staging.iomsuite.com"
#   __ROOT__          /srv/ioms/app/public
#   __PORT__          the loopback port Caddy forwards to (default 8081)
#
# ARCHITECTURE when the host already runs Caddy on 80/443 (the Hermes image):
#   visitor --HTTPS--> Cloudflare --HTTPS, Full (strict)--> Caddy (owns 80/443,
#   also fronts the Hermes dashboard) --HTTP, loopback--> this nginx --> PHP-FPM
#
# Caddy terminates TLS with the Cloudflare Origin certificate (/etc/caddy/ioms.caddy).
# This server is reachable from 127.0.0.1 ONLY; the visitor IP arrives in
# CF-Connecting-IP and is trusted from the loopback hop alone
# (/etc/nginx/conf.d/ioms-realip.conf).

server {
    listen 127.0.0.1:__PORT__;
    server_name __SERVER_NAMES__;
    root __ROOT__;
    index index.php;

    charset utf-8;
    client_max_body_size 30M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The payment provider's callback must reach PHP untouched.
    location = /webhooks/payment/duitku {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/ioms-fpm.sock;   # the ioms pool, running as the app user
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Caddy terminated HTTPS; tell Laravel so it builds https:// links.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
