<?xml version="1.0" encoding="UTF-8"?>
<!--
    v2.128.0 — THE OFFICIAL IOMS LOCKUP, STACKED.

    NOT A REDRAW. Every path in this file is copied, coordinate for
    coordinate, out of the two official assets: the cyan symbol from
    `ioms-icon.svg` and the navy word from `ioms-logo.svg` (its `.st2`
    paths, which are the letterforms of the horizontal lockup). Each is
    placed in a nested <svg> carrying its SOURCE viewBox, so the artwork is
    scaled by the renderer and never re-expressed — a path edited by hand
    would be a second, drifting copy of a mark that belongs to the owner.

    WHY A STACKED FILE EXISTS AT ALL. The official lockup is horizontal and
    is 3.85:1; a splash screen is portrait and a 3.85:1 lockup across it is
    either tiny or edge-to-edge. The composition here follows the owner's
    reference: symbol above, word below, word about 1.75x the symbol's
    width, separated by a quarter of the word's height. Both boxes were
    MEASURED with getBBox() in a real renderer rather than read off the
    viewBox, because each source viewBox is padded and the padding differs.

    Used by the boot splash (resources/views/app.blade.php) and the iOS
    startup images generated from it. See ADR 068.
-->
